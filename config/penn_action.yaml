work_dir: ./work_dir/penn_action/gaussian_splatting
model_saved_name: ./runs/penn_action_gs

# feeder
feeder: feeders.feeder_penn.Feeder
train_feeder_args:
  data_path: data/Penn_Action/processed_data/train_data_joint.npy
  label_path: data/Penn_Action/processed_data/train_label.pkl
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: 100
  normalization: False
test_feeder_args:
  data_path: data/Penn_Action/processed_data/test_data_joint.npy
  label_path: data/Penn_Action/processed_data/test_label.pkl
  split: test
  window_size: 100

# model
model: model.kgs_gcn.Model
model_args:
  num_class: 15
  num_point: 13
  num_person: 1
  in_channels: 3
  graph: graph.penn_action.Graph
  graph_args:
    labeling_mode: 'spatial'

# optim
weight_decay: 0.0004
base_lr: 0.05
step: [40, 60]
warm_up_epoch: 10

device: [0]
batch_size: 16
test_batch_size: 16
num_epoch: 70
nesterov: True
lambda_topo: 0.2
